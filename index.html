<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d12">
    <meta name="description" data-copy-content="meta.description">
    <title data-copy="meta.title"></title>
    <link rel="icon" type="image/png" href="assets/logo/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=13">
    <script src="content.js?v=5" defer></script>
    <script src="firebase-config.js?v=1" defer></script>
    <script src="steam-config.js?v=3" defer></script>
    <script src="app.js?v=10" defer></script>
    <script src="auth.js?v=8" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" data-copy-aria="brand.homeAria">
        <img class="brand-logo" src="assets/logo/logo.png" alt="">
        <span><span data-copy="brand.namePrefix"></span><span class="brand-number" data-copy="brand.nameNumber"></span></span>
      </a>
      <nav class="main-nav" data-copy-aria="nav.mainNavAria">
        <a class="nav-link active" href="#home" data-page-link="home" data-copy="nav.home"></a>
        <a class="nav-link" href="#shop" data-page-link="shop" data-copy="nav.shop"></a>
        <a class="nav-link" href="#trade" data-page-link="trade" data-copy="nav.trade"></a>
      </nav>
      <div class="header-actions header-utility-card">
        <div class="ec-balance" id="ec-balance-wrapper" data-copy-aria="nav.balanceAria" hidden><span data-copy="product.currency"></span><strong id="balance" data-copy="wallet.displayBalance"></strong><small data-copy="nav.balanceNote"></small></div>
        <button class="cart-button" id="open-cart" type="button" data-copy-aria="nav.cartAria">
          <img src="assets/icon/icon-cart.png" alt="" aria-hidden="true">
          <span class="cart-count" id="cart-count">0</span>
        </button>
        <button class="account-button" id="profile-shortcut" type="button" data-page="profile" data-copy-aria="nav.accountAria" data-copy="nav.account"></button>
      </div>
    </header>

    <main>
      <section class="page-view active" id="page-home" data-page-view="home">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <div class="eyebrow"><span class="live-dot"></span> <span data-copy="home.eyebrow"></span></div>
            <h1 id="hero-title"><span data-copy="home.heroTitleFirst"></span><br><span data-copy="home.heroTitleSecond"></span></h1>
            <p data-copy="home.heroDescription"></p>
            <div class="hero-actions">
              <a class="primary-button" href="#shop"><span data-copy="home.shopCta"></span> <img class="button-icon" src="assets/icon/icon-external-link.png" alt="" aria-hidden="true"></a>
              <a class="secondary-button" href="#trade"><span data-copy="home.tradeCta"></span> <img class="button-icon" src="assets/icon/icon-swap.png" alt="" aria-hidden="true"></a>
            </div>
          </div>
          <img class="hero-banner" src="assets/banner/banner.png" data-copy-alt="home.bannerAlt">
        </section>
        <section class="ec-info-strip" data-copy-aria="home.ecAria">
          <span class="ec-strip-title"><span data-copy="home.marketLabel"></span> <strong data-copy="product.currency"></strong></span>
          <span class="ec-rate"><span data-copy="home.ecRateRobux"></span> <small data-copy="home.provisional"></small></span>
          <span class="ec-rate" data-copy="home.ecRateSkinApe"></span>
          <span class="ec-rate"><span data-copy="home.cashValue"></span> <strong data-copy="home.cashValueUnset"></strong></span>
          <span class="ec-strip-note" data-copy="home.friendsOnly"></span>
        </section>
        <section class="home-discovery section-wrap" data-copy-aria="home.searchAria">
          <form class="home-search" id="home-search-form">
            <img src="assets/icon/icon-search.png" alt="" aria-hidden="true">
            <input id="home-search" type="search" data-copy-placeholder="home.homeSearchPlaceholder" data-copy-aria="home.homeSearchAria">
            <button type="submit"><span data-copy="home.searchButton"></span> <img class="button-icon" src="assets/icon/icon-external-link.png" alt="" aria-hidden="true"></button>
          </form>
          <div class="home-categories" id="home-categories" data-copy-aria="home.quickCategoriesAria"></div>
        </section>
        <section class="home-shortcuts section-wrap" id="marketplace">
          <div class="home-section-heading"><div><div class="eyebrow section-eyebrow" data-copy="home.marketplaceEyebrow"></div><h2 data-copy="home.marketplaceTitle"></h2><p data-copy="home.marketplaceDescription"></p></div><a class="text-link" href="#shop"><span data-copy="home.browseAll"></span> <img class="button-icon" src="assets/icon/icon-external-link.png" alt="" aria-hidden="true"></a></div>
          <div class="market-tabs"><button class="market-tab active" type="button" data-market-mode="featured" data-copy="home.marketFeatured"></button><button class="market-tab" type="button" data-market-mode="latest" data-copy="home.marketLatest"></button><button class="market-tab" type="button" data-market-mode="budget" data-copy="home.marketBudget"></button><label class="home-sort-label"><span data-copy="home.sortLabel"></span><select id="home-sort" data-copy-aria="home.homeSortAria"><option value="featured" data-copy="home.sortRecommended"></option><option value="price-ascending" data-copy="home.sortPriceLow"></option><option value="price-descending" data-copy="home.sortPriceHigh"></option></select></label></div>
          <div class="product-grid featured-grid" id="featured-grid"></div>
          <p class="prototype-note" data-copy="home.prototypeNote"></p>
        </section>
        <section class="curated-section section-wrap">
          <div class="home-section-heading"><div><div class="eyebrow section-eyebrow" data-copy="home.curatedEyebrow"></div><h2 data-copy="home.curatedTitle"></h2><p data-copy="home.curatedDescription"></p></div><a class="text-link" href="#shop"><span data-copy="home.viewListings"></span> <img class="button-icon" src="assets/icon/icon-external-link.png" alt="" aria-hidden="true"></a></div>
          <div class="curated-grid" id="curated-grid"></div>
        </section>
        <section class="trade-preview section-wrap">
          <div class="home-section-heading"><div><div class="eyebrow section-eyebrow" data-copy="home.tradeDeskEyebrow"></div><h2 data-copy="home.tradeDeskTitle"></h2><p data-copy="home.tradeDeskDescription"></p></div><a class="text-link" href="#trade"><span data-copy="home.enterTrade"></span> <img class="button-icon" src="assets/icon/icon-external-link.png" alt="" aria-hidden="true"></a></div>
          <div class="trade-desk-preview">
            <div class="preview-offer">
              <span class="preview-label" data-copy="home.offerOwnItem"></span>
              <div class="preview-item"><span class="preview-item-art preview-ak"></span><span><strong data-copy="featuredItems.akName"></strong><small data-copy="featuredItems.akCondition"></small></span><strong class="preview-price" data-copy="featuredItems.akPrice"></strong></div>
            </div>
            <div class="preview-swap" aria-hidden="true"><img class="preview-swap-icon" src="assets/icon/icon-swap.png" alt=""></div>
            <div class="preview-offer">
              <span class="preview-label" data-copy="home.offerWantedItem"></span>
              <div class="preview-item"><span class="preview-item-art preview-awp"></span><span><strong data-copy="featuredItems.awpName"></strong><small data-copy="featuredItems.awpCondition"></small></span><strong class="preview-price" data-copy="featuredItems.awpPrice"></strong></div>
            </div>
            <div class="trade-summary"><span data-copy="home.tradeDifference"></span><strong data-copy="home.tradeDifferenceValue"></strong><p data-copy="home.tradeDifferenceNote"></p><a class="primary-button" href="#trade"><span data-copy="home.startTrade"></span> <img class="button-icon" src="assets/icon/icon-swap.png" alt="" aria-hidden="true"></a></div>
          </div>
          <p class="prototype-note" data-copy="home.previewInventoryNote"></p>
        </section>
        <section class="rewards-section section-wrap" id="rewards">
          <div class="home-section-heading"><div><div class="eyebrow section-eyebrow" data-copy="home.rewardsEyebrow"></div><h2 data-copy="home.rewardsTitle"></h2><p data-copy="home.rewardsDescription"></p></div><span class="reward-provisional" data-copy="home.rewardsProvisional"></span></div>
          <div class="reward-milestones">
            <article class="reward-milestone"><span class="reward-step">01</span><span><strong data-copy="home.rewardOne"></strong><small data-copy="home.rewardAmount"></small></span><strong class="reward-value"><span data-copy="home.rewardOneBonus"></span> <small data-copy="product.currency"></small></strong></article>
            <article class="reward-milestone"><span class="reward-step">02</span><span><strong data-copy="home.rewardTwo"></strong><small data-copy="home.rewardAmount"></small></span><strong class="reward-value"><span data-copy="home.rewardTwoBonus"></span> <small data-copy="product.currency"></small></strong></article>
            <p data-copy="home.rewardMore"></p>
          </div>
        </section>
        <section class="guide-section section-wrap" id="guide">
          <div class="home-section-heading"><div><div class="eyebrow section-eyebrow" data-copy="home.guideEyebrow"></div><h2 data-copy="home.guideTitle"></h2></div><a class="text-link" href="#trade"><span data-copy="home.guideLink"></span> <img class="button-icon" src="assets/icon/icon-external-link.png" alt="" aria-hidden="true"></a></div>
          <div class="guide-steps">
            <article><span class="step-number">01</span><span class="step-icon" aria-hidden="true"><img src="assets/icon/icon-search.png" alt=""></span><h3 data-copy="home.guideStep1Title"></h3><p data-copy="home.guideStep1Description"></p></article>
            <article><span class="step-number">02</span><span class="step-icon" aria-hidden="true"><img src="assets/icon/icon-swap.png" alt=""></span><h3 data-copy="home.guideStep2Title"></h3><p data-copy="home.guideStep2Description"></p></article>
            <article><span class="step-number">03</span><span class="step-icon" aria-hidden="true" data-copy="home.guideStep3Icon"></span><h3 data-copy="home.guideStep3Title"></h3><p data-copy="home.guideStep3Description"></p></article>
          </div>
        </section>
        <section class="safety-faq section-wrap" id="safety">
          <div class="safety-copy"><div class="eyebrow section-eyebrow" data-copy="home.safetyEyebrow"></div><h2><span data-copy="home.safetyTitleFirst"></span><br><span data-copy="home.safetyTitleSecond"></span></h2><p data-copy="home.safetyDescription"></p><ul><li data-copy="home.safetyRule1"></li><li data-copy="home.safetyRule2"></li><li data-copy="home.safetyRule3"></li><li data-copy="home.safetyRule4"></li></ul></div>
          <div class="faq-list"><div class="eyebrow section-eyebrow" data-copy="home.faqEyebrow"></div><details open><summary data-copy="home.faqPurchaseQuestion"></summary><p data-copy="home.faqPurchaseAnswer"></p></details><details><summary data-copy="home.faqStockQuestion"></summary><p data-copy="home.faqStockAnswer"></p></details><details><summary data-copy="home.faqTradeQuestion"></summary><p data-copy="home.faqTradeAnswer"></p></details><details><summary data-copy="home.faqAccountQuestion"></summary><p data-copy="home.faqAccountAnswer"></p></details></div>
        </section>
      </section>

      <section class="page-view section-wrap shop-page" id="page-shop" data-page-view="shop" hidden>
        <div class="section-heading page-heading">
          <div><div class="eyebrow section-eyebrow"><span data-copy="shop.eyebrow"></span> <span class="heading-line"></span></div><h1><span data-copy="shop.title"></span><span class="heading-period">.</span></h1><p data-copy="shop.description"></p></div>
          <label class="search-box"><img src="assets/icon/icon-search.png" alt="" aria-hidden="true"><input id="search" type="search" data-copy-placeholder="shop.searchPlaceholder" data-copy-aria="shop.searchAria"><span class="search-shortcut">⌕</span></label>
        </div>
        <section class="steam-stock-panel" aria-labelledby="steam-stock-title">
          <div>
            <div class="eyebrow section-eyebrow" data-copy="shop.inventoryEyebrow"></div>
            <h2 id="steam-stock-title" data-copy="shop.inventoryTitle"></h2>
            <p id="steam-inventory-status" role="status" aria-live="polite" data-copy="shop.inventoryInitialStatus"></p>
            <small data-copy="shop.inventoryHint"></small>
          </div>
          <div class="steam-stock-actions">
            <button class="secondary-button" id="refresh-steam-inventory" type="button" data-copy="shop.inventoryRefresh"></button>
            <a class="primary-button" id="steam-trade-link" href="https://steamcommunity.com/tradeoffer/new/?partner=1923602505&amp;token=_h1a31-A" target="_blank" rel="noopener noreferrer"><span data-copy="shop.steamTrade"></span> <img class="button-icon" src="assets/icon/icon-external-link.png" alt="" aria-hidden="true"></a>
          </div>
        </section>
        <div class="store-controls">
          <div class="filter-list" id="category-filters" data-copy-aria="shop.categoriesAria"></div>
          <div class="game-filters" id="game-filters" data-copy-aria="shop.gamesAria"></div>
          <label class="sort-control" for="sort-products"><span data-copy="shop.sortLabel"></span>
            <select id="sort-products" data-copy-aria="shop.sortAria">
              <option value="featured" data-copy="shop.sortRecommended"></option>
              <option value="price-ascending" data-copy="shop.sortPriceLow"></option>
              <option value="price-descending" data-copy="shop.sortPriceHigh"></option>
              <option value="stock-descending" data-copy="shop.sortStock"></option>
              <option value="name-ascending" data-copy="shop.sortName"></option>
            </select>
          </label>
        </div>
        <div class="product-grid" id="product-grid" aria-live="polite"></div>
        <div class="empty-state" id="empty-state" hidden data-copy="shop.empty"></div>
        <div class="catalog-foot"><span><span data-copy="shop.countPrefix"></span> <strong id="product-total">0</strong> <span data-copy="shop.countSuffix"></span></span><span data-copy="shop.catalogNote"></span></div>
      </section>

      <section class="page-view section-wrap trade-page" id="page-trade" data-page-view="trade" hidden>
        <div class="page-heading trade-heading">
          <div><div class="eyebrow section-eyebrow"><span data-copy="trade.eyebrow"></span> <span class="heading-line"></span></div><h1><span data-copy="trade.title"></span><span class="heading-period">.</span></h1><p data-copy="trade.description"></p></div>
          <button class="primary-button" type="button" data-requires-auth="true"><span data-copy="trade.createListing"></span> <img class="button-icon" src="assets/icon/icon-add.png" alt="" aria-hidden="true"></button>
        </div>
        <div class="trade-notice"><span class="notice-mark" aria-hidden="true" data-copy="trade.noticeIcon"></span><span data-copy="trade.notice"></span></div>
        <div class="trade-grid" id="trade-grid"></div>
      </section>

      <section class="page-view section-wrap profile-page" id="page-profile" data-page-view="profile" hidden>
        <div class="page-heading"><div><div class="eyebrow section-eyebrow"><span data-copy="profile.eyebrow"></span> <span class="heading-line"></span></div><h1><span data-copy="profile.title"></span><span class="heading-period">.</span></h1><p data-copy="profile.description"></p></div></div>
        <div class="profile-layout">
          <section class="profile-card">
            <div class="profile-avatar" id="profile-avatar" data-copy-aria="profile.avatarAria">E</div>
            <h2 id="profile-name" data-copy="profile.guest"></h2>
            <p id="profile-email" data-copy="profile.guestDescription"></p>
            <div class="profile-balance"><span data-copy="profile.balanceLabel"></span><strong><span class="coin-symbol" data-copy="product.currency"></span> <span id="profile-balance" data-copy="wallet.displayBalance"></span></strong></div>
            <button class="signout-button" id="sign-out" type="button" hidden data-copy="profile.signOut"></button>
          </section>
          <section class="auth-card" id="auth-card" aria-labelledby="auth-title">
            <div class="auth-tabs" role="tablist" data-copy-aria="profile.accountOptions">
              <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="auth-form" data-auth-mode="login" data-copy="profile.loginTab"></button>
              <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-form" data-auth-mode="register" data-copy="profile.registerTab"></button>
            </div>
            <h2 id="auth-title" data-copy="profile.loginTitle"></h2>
            <p class="auth-subtitle" id="auth-subtitle" data-copy="profile.loginDescription"></p>
            <div class="firebase-notice" id="firebase-notice" role="status" data-copy="profile.firebaseMissing"></div>
            <form id="auth-form">
              <label class="auth-field" id="display-name-field" hidden><span data-copy="profile.displayName"></span><input id="display-name" name="displayName" type="text" autocomplete="nickname" maxlength="30" data-copy-placeholder="profile.displayNamePlaceholder"></label>
              <label class="auth-field"><span data-copy="profile.email"></span><input id="email" name="email" type="email" autocomplete="email" required data-copy-placeholder="profile.emailPlaceholder"></label>
              <label class="auth-field"><span data-copy="profile.password"></span><span class="password-input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required data-copy-placeholder="profile.passwordPlaceholder"><button class="password-toggle" type="button" data-password-toggle="password" aria-pressed="false" data-copy="profile.showPassword" data-copy-aria="profile.showPassword"></button></span></label>
              <label class="auth-field" id="confirm-password-field" hidden><span data-copy="profile.confirmPassword"></span><span class="password-input-wrap"><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" data-copy-placeholder="profile.confirmPasswordPlaceholder"><button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-pressed="false" data-copy="profile.showPassword" data-copy-aria="profile.showPassword"></button></span></label>
              <button class="auth-submit" id="auth-submit" type="submit" data-copy="profile.login"></button>
              <button class="google-auth-button" id="google-auth" type="button"><span class="google-auth-mark" aria-hidden="true">G</span><span data-copy="profile.googleLogin"></span></button>
              <button class="steam-auth-button" id="steam-auth" type="button" data-copy="profile.steamLogin"></button>
              <button class="password-reset" id="password-reset" type="button" data-copy="profile.passwordReset"></button>
              <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
            </form>
            <p class="auth-privacy" data-copy="profile.accountPrivacy"></p>
          </section>
        </div>
        <section class="account-safety-note"><span class="eyebrow section-eyebrow" data-copy="profile.accountSafetyEyebrow"></span><h2 data-copy="profile.accountSafetyTitle"></h2><p data-copy="profile.accountSafetyDescription"></p></section>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-main"><a class="brand footer-brand" href="#home" data-copy-aria="brand.homeAria"><img class="brand-logo" src="assets/logo/logo.png" alt=""><span><span data-copy="brand.namePrefix"></span><span class="brand-number" data-copy="brand.nameNumber"></span></span></a><p data-copy="brand.footerTagline"></p><span data-copy="brand.footerDescription"></span></div>
      <div class="footer-column"><strong data-copy="footer.explore"></strong><a href="#shop" data-copy="footer.shop"></a><a href="#trade" data-copy="footer.trade"></a><a href="#marketplace" data-home-anchor="marketplace" data-copy="footer.curated"></a></div>
      <div class="footer-column"><strong data-copy="footer.support"></strong><a href="#guide" data-home-anchor="guide" data-copy="footer.guide"></a><a href="#safety" data-home-anchor="safety" data-copy="footer.safety"></a><a href="#safety" data-home-anchor="safety" data-copy="footer.faq"></a></div>
      <div class="footer-column"><strong data-copy="footer.about"></strong><a href="#home" data-copy="footer.aboutSite"></a><a href="#profile" data-copy="footer.privacy"></a><a href="#safety" data-home-anchor="safety" data-copy="footer.prototype"></a></div>
      <div class="footer-bottom"><span data-copy="footer.copyright"></span><span data-copy="footer.note"></span></div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="cart-modal" hidden>
      <section class="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cart-title">
        <div class="cart-head"><div><div class="eyebrow section-eyebrow" data-copy="cart.eyebrow"></div><h2 id="cart-title" data-copy="cart.title"></h2></div><button class="close-button" id="close-cart" type="button" data-copy-aria="cart.closeAria"><img src="assets/icon/icon-close.png" alt="" aria-hidden="true"></button></div>
        <div class="cart-items" id="cart-items"></div><div class="cart-empty" id="cart-empty" data-copy="cart.empty"></div>
        <div class="cart-footer"><div class="cart-total"><span data-copy="cart.total"></span><strong><span class="currency-symbol" data-copy="product.currency"></span><span id="cart-total">0</span></strong></div><button class="checkout-button" id="checkout" type="button" data-copy="cart.checkout"></button><p data-copy="cart.note"></p></div>
      </section>
    </div>
  </body>
</html>
