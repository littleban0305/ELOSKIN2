<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d12">
    <meta name="description" data-copy-content="meta.description">
    <title data-copy="meta.title"></title>
    <link rel="icon" type="image/png" href="assets/logo/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=36">
    <script src="content.js?v=16" defer></script>
    <script src="firebase-config.js?v=1" defer></script>
    <script src="steam-config.js?v=3" defer></script>
    <script src="app.js?v=18" defer></script>
    <script src="auth.js?v=14" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" data-copy-aria="brand.homeAria">
        <img class="brand-logo" src="assets/logo/logo.png" alt="">
        <span><span data-copy="brand.namePrefix"></span><span class="brand-number" data-copy="brand.nameNumber"></span></span>
      </a>
      <nav class="main-nav" data-copy-aria="nav.mainNavAria">
        <a class="nav-link active" href="#home" data-page-link="home" data-copy="nav.home"></a>
        <a class="nav-link" href="#shop" data-page-link="shop" data-copy="nav.shop"></a>
        <a class="nav-link" href="#trade" data-page-link="trade" data-copy="nav.trade"></a>
      </nav>
      <div class="header-actions header-utility-card">
        <button class="cart-button" id="open-cart" type="button" data-copy-aria="nav.cartAria">
          <img src="assets/icon_new/shopping_cart_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="" aria-hidden="true">
          <span class="cart-count" id="cart-count">0</span>
        </button>
        <button class="account-button" id="profile-shortcut" type="button" data-page="profile" data-copy-aria="nav.accountAria" data-copy="nav.account"></button>
      </div>
    </header>

    <main>
      <section class="page-view active" id="page-home" data-page-view="home">
        <section class="hero">
          <img class="hero-banner" src="assets/banner/banner.png" data-copy-alt="home.bannerAlt">
          <div class="hero-copy">
            <h1><span data-copy="home.heroTitleLead"></span><span class="hero-title-accent" data-copy="home.heroTitleAccent"></span><span data-copy="home.heroTitleTail"></span></h1>
            <p data-copy="home.heroDescription"></p>
            <div class="hero-actions">
              <a class="primary-button" href="#shop"><span data-copy="home.shopCta"></span></a>
              <a class="secondary-button hero-trade-button" href="#trade" data-copy="home.tradeCta"></a>
            </div>
          </div>
        </section>
        <section class="home-shortcuts section-wrap" id="marketplace" data-copy-aria="home.marketSectionAria">
          <div class="home-market-heading">
            <div class="market-tabs" role="group" data-copy-aria="home.marketModesAria">
              <button class="market-tab active" type="button" data-market-mode="popular" aria-pressed="true" data-copy="home.marketPopular"></button>
              <button class="market-tab" type="button" data-market-mode="expensive" aria-pressed="false" data-copy="home.marketExpensive"></button>
              <button class="market-tab" type="button" data-market-mode="cheap" aria-pressed="false" data-copy="home.marketCheap"></button>
            </div>
          </div>
          <div class="home-product-row">
            <div class="product-grid featured-grid" id="featured-grid" aria-live="polite"></div>
            <button class="home-market-more" id="home-more-products" type="button" data-copy-aria="home.marketMoreAria">
              <img src="assets/icon_new/arrow_forward_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="" aria-hidden="true">
            </button>
          </div>
        </section>
        <section class="home-faq section-wrap" aria-labelledby="home-faq-title">
          <div class="home-faq-copy">
            <h2 id="home-faq-title" data-copy="home.faqTitle"></h2>
            <p data-copy="home.faqSubtitle"></p>
          </div>
          <div class="home-faq-list">
            <details class="home-faq-item" open>
              <summary>
                <span data-copy="home.faqItems.purchase.question"></span>
                <span class="home-faq-icons" aria-hidden="true">
                  <img class="home-faq-icon-add" src="assets/icon_new/add_circle_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="">
                  <img class="home-faq-icon-minus" src="assets/icon_new/minus_circle_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="">
                </span>
              </summary>
              <p data-copy="home.faqItems.purchase.answer"></p>
            </details>
            <details class="home-faq-item">
              <summary>
                <span data-copy="home.faqItems.demo.question"></span>
                <span class="home-faq-icons" aria-hidden="true">
                  <img class="home-faq-icon-add" src="assets/icon_new/add_circle_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="">
                  <img class="home-faq-icon-minus" src="assets/icon_new/minus_circle_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="">
                </span>
              </summary>
              <p data-copy="home.faqItems.demo.answer"></p>
            </details>
            <details class="home-faq-item">
              <summary>
                <span data-copy="home.faqItems.trade.question"></span>
                <span class="home-faq-icons" aria-hidden="true">
                  <img class="home-faq-icon-add" src="assets/icon_new/add_circle_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="">
                  <img class="home-faq-icon-minus" src="assets/icon_new/minus_circle_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="">
                </span>
              </summary>
              <p data-copy="home.faqItems.trade.answer"></p>
            </details>
          </div>
        </section>
        <section class="home-discovery section-wrap" hidden>
          <form class="home-search" id="home-search-form">
            <input id="home-search" type="search">
            <button type="submit"></button>
          </form>
          <div class="home-categories" id="home-categories"></div>
        </section>
      </section>

      <section class="page-view section-wrap shop-page" id="page-shop" data-page-view="shop" hidden>
        <div class="section-heading page-heading">
          <div><h1 data-copy="shop.title"></h1></div>
          <label class="search-box"><img src="assets/icon_new/search_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="" aria-hidden="true"><input id="search" type="search" data-copy-placeholder="shop.searchPlaceholder" data-copy-aria="shop.searchAria"><span class="search-shortcut">⌕</span></label>
        </div>
        <div class="store-controls">
          <div class="filter-list" id="category-filters" data-copy-aria="shop.categoriesAria"></div>
          <div class="game-filters" id="game-filters" data-copy-aria="shop.gamesAria"></div>
          <label class="sort-control" for="sort-products"><span data-copy="shop.sortLabel"></span>
            <select id="sort-products" data-copy-aria="shop.sortAria">
              <option value="featured" data-copy="shop.sortRecommended"></option>
              <option value="price-ascending" data-copy="shop.sortPriceLow"></option>
              <option value="price-descending" data-copy="shop.sortPriceHigh"></option>
              <option value="stock-descending" data-copy="shop.sortStock"></option>
              <option value="name-ascending" data-copy="shop.sortName"></option>
            </select>
          </label>
        </div>
        <div class="product-grid" id="product-grid" aria-live="polite"></div>
        <div class="empty-state" id="empty-state" hidden data-copy="shop.empty"></div>
        <div class="catalog-foot"><span><span data-copy="shop.countPrefix"></span> <strong id="product-total">0</strong> <span data-copy="shop.countSuffix"></span></span></div>
      </section>

      <section class="page-view section-wrap trade-page" id="page-trade" data-page-view="trade" hidden>
        <div class="page-heading trade-heading">
          <h1 data-copy="trade.title"></h1>
        </div>
        <div hidden>
          <div class="trade-grid" id="trade-grid"></div>
        </div>
      </section>

      <section class="page-view section-wrap profile-page" id="page-profile" data-page-view="profile" hidden>
        <div class="page-heading"><div><h1 data-copy="profile.title"></h1></div></div>
        <div hidden>
        <div class="profile-layout">
          <section class="profile-card">
            <div class="profile-avatar" id="profile-avatar" data-copy-aria="profile.avatarAria"><span class="profile-avatar-initial" id="profile-avatar-initial">E</span><img class="profile-avatar-image" id="profile-avatar-image" alt="" hidden></div>
            <input class="avatar-file-input" id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
            <button class="avatar-upload-button" id="avatar-upload" type="button" hidden data-copy="profile.avatarUpload"></button>
            <p class="avatar-status" id="avatar-status" role="status" aria-live="polite" hidden></p>
            <h2 id="profile-name" data-copy="profile.guest"></h2>
            <p id="profile-email" data-copy="profile.guestDescription"></p>
            <button class="signout-button" id="sign-out" type="button" hidden data-copy="profile.signOut"></button>
          </section>
          <section class="auth-card" id="auth-card" aria-labelledby="auth-title">
            <div class="auth-tabs" role="tablist" data-copy-aria="profile.accountOptions">
              <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="auth-form" data-auth-mode="login" data-copy="profile.loginTab"></button>
              <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-form" data-auth-mode="register" data-copy="profile.registerTab"></button>
            </div>
            <h2 id="auth-title" data-copy="profile.loginTitle"></h2>
            <p class="auth-subtitle" id="auth-subtitle" data-copy="profile.loginDescription"></p>
            <div class="firebase-notice" id="firebase-notice" role="status" data-copy="profile.firebaseMissing" hidden></div>
            <form id="auth-form">
              <label class="auth-field" id="display-name-field" hidden><span data-copy="profile.displayName"></span><input id="display-name" name="displayName" type="text" autocomplete="nickname" maxlength="30" data-copy-placeholder="profile.displayNamePlaceholder"></label>
              <label class="auth-field"><span data-copy="profile.email"></span><input id="email" name="email" type="email" autocomplete="email" required data-copy-placeholder="profile.emailPlaceholder"></label>
              <label class="auth-field"><span data-copy="profile.password"></span><span class="password-input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required data-copy-placeholder="profile.passwordPlaceholder"><button class="password-toggle" type="button" data-password-toggle="password" aria-pressed="false" data-copy="profile.showPassword" data-copy-aria="profile.showPassword"></button></span></label>
              <label class="auth-field" id="confirm-password-field" hidden><span data-copy="profile.confirmPassword"></span><span class="password-input-wrap"><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" data-copy-placeholder="profile.confirmPasswordPlaceholder"><button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-pressed="false" data-copy="profile.showPassword" data-copy-aria="profile.showPassword"></button></span></label>
              <button class="auth-submit" id="auth-submit" type="submit" data-copy="profile.login"></button>
              <button class="google-auth-button" id="google-auth" type="button"><span class="google-auth-mark" aria-hidden="true">G</span><span data-copy="profile.googleLogin"></span></button>
              <button class="steam-auth-button" id="steam-auth" type="button" data-copy="profile.steamLogin"></button>
              <button class="password-reset" id="password-reset" type="button" data-copy="profile.passwordReset"></button>
              <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
            </form>
          </section>
        </div>
        <section class="admin-panel" id="admin-panel" hidden>
          <div class="admin-panel-heading">
            <div>
              <h2 data-copy="profile.adminTitle"></h2>
              <p data-copy="profile.adminDescription"></p>
            </div>
            <button class="admin-verify-button" id="admin-verify-email" type="button" hidden data-copy="profile.adminSendVerification"></button>
          </div>
          <p class="admin-catalog-status" id="admin-catalog-status" role="status" aria-live="polite"></p>
          <label class="admin-search">
            <span class="visually-hidden" data-copy="profile.adminSearchLabel"></span>
            <input id="admin-product-search" type="search" data-copy-placeholder="profile.adminSearchPlaceholder">
          </label>
          <div class="admin-product-list" id="admin-product-list"></div>
        </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-main"><a class="brand footer-brand" href="#home" data-copy-aria="brand.homeAria"><img class="brand-logo" src="assets/logo/logo.png" alt=""><span><span data-copy="brand.namePrefix"></span><span class="brand-number" data-copy="brand.nameNumber"></span></span></a></div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="cart-modal" hidden>
      <section class="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cart-title">
        <div class="cart-head"><div><h2 id="cart-title" data-copy="cart.title"></h2></div><button class="close-button" id="close-cart" type="button" data-copy-aria="cart.closeAria"><img src="assets/icon_new/close_256dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="" aria-hidden="true"></button></div>
        <div class="cart-items" id="cart-items"></div><div class="cart-empty" id="cart-empty" data-copy="cart.empty"></div>
        <div class="cart-footer"><div class="cart-total"><span data-copy="cart.total"></span><strong><span class="currency-symbol" data-copy="product.currency"></span><span id="cart-total">0</span></strong></div><button class="checkout-button" id="checkout" type="button" data-copy="cart.checkout"></button></div>
      </section>
    </div>
  </body>
</html>
